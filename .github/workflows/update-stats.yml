name: Update live stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch stats and rewrite README
        run: |
          if [ -z "${{ secrets.GH_STATS_TOKEN }}" ]; then
            echo "::error::GH_STATS_TOKEN secret is empty or missing. Please add a Classic PAT with read:user scope as a repository secret named GH_STATS_TOKEN."
            echo "Falling back to GITHUB_TOKEN, which may not have sufficient permissions to read user-level GraphQL data."
          fi
          python scripts/update_readme.py
        env:
          # Optional: add a PAT (scope: read:user) as GH_STATS_TOKEN to include private contributions
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Nothing to commit."
          else
            git commit -m "chore(stats): sync live telemetry"
            git push
          fi